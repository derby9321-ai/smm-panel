YPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Social Genie - Professional Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-blue-600 text-white flex flex-col hidden md:flex">
            <div class="p-5 text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Social Genie
            </div>
            <div class="px-4 py-3 bg-blue-700 mx-3 rounded-lg mb-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-blue-200">Welcome,</p>
                    <p class="font-semibold">farhan09</p>
                </div>
                <span class="bg-blue-500 text-xs px-2 py-1 rounded">$0</span>
            </div>
            <nav class="flex-1 px-3 space-y-1">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-700 rounded-xl font-medium"><i class="fa-solid fa-cart-shopping"></i> New Order</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-blue-700 rounded-xl font-medium transition"><i class="fa-solid fa-boxes-stacked"></i> Bulk Order</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-blue-700 rounded-xl font-medium transition"><i class="fa-solid fa-clock-rotate-left"></i> Orders History</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-blue-700 rounded-xl font-medium transition"><i class="fa-solid fa-list"></i> Services</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-blue-700 rounded-xl font-medium transition"><i class="fa-solid fa-wallet"></i> Add Funds</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-blue-700 rounded-xl font-medium transition"><i class="fa-solid fa-headset"></i> Tickets Support</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <!-- Topbar -->
            <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-slate-800">New Order</h1>
                <div class="flex items-center gap-4">
                    <span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-sm font-medium"><i class="fa-regular fa-calendar"></i> Sep 19, 2026</span>
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">F</div>
                </div>
            </header>

            <!-- Content Body -->
            <main class="p-6 space-y-6">
                <!-- Stats Row -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-slate-500 text-sm">My Balance</p>
                            <h3 class="text-2xl font-bold text-slate-800">$0 <span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded">USD</span></h3>
                        </div>
                        <div class="w-12 h-12 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-wallet"></i></div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-slate-500 text-sm">Total Orders</p>
                            <h3 class="text-2xl font-bold text-slate-800">136</h3>
                        </div>
                        <div class="w-12 h-12 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-cart-flatbed"></i></div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                        <div>
                            <p class="text-slate-500 text-sm">Spent Balance</p>
                            <h3 class="text-2xl font-bold text-slate-800">$0</h3>
                        </div>
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-money-bill-wave"></i></div>
                    </div>
                </div>

                <!-- Platform Filters -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button onclick="filterPlatform('instagram')" id="btn-instagram" class="platform-btn bg-white p-3 rounded-xl shadow-sm border-2 border-blue-600 text-blue-600 font-semibold flex items-center gap-2 transition"><i class="fa-brands fa-instagram"></i> Instagram</button>
                    <button onclick="filterPlatform('facebook')" id="btn-facebook" class="platform-btn bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-slate-600 font-semibold flex items-center gap-2 hover:bg-slate-50 transition"><i class="fa-brands fa-facebook"></i> Facebook</button>
                    <button onclick="filterPlatform('youtube')" id="btn-youtube" class="platform-btn bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-slate-600 font-semibold flex items-center gap-2 hover:bg-slate-50 transition"><i class="fa-brands fa-youtube"></i> Youtube</button>
                    <button onclick="filterPlatform('telegram')" id="btn-telegram" class="platform-btn bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-slate-600 font-semibold flex items-center gap-2 hover:bg-slate-50 transition"><i class="fa-brands fa-telegram"></i> Telegram</button>
                </div>

                <!-- Order Form Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-2xl">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">Create New Order</h2>
                    <form id="orderForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Category</label>
                            <select id="categorySelect" class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600">
                                <!-- Dynamically filled -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Service ID</label>
                            <input type="text" id="serviceId" placeholder="Enter JAP Service ID" class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Link</label>
                            <input type="text" id="targetLink" placeholder="https://..." class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Quantity</label>
                            <input type="number" id="quantity" placeholder="1000" class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-600" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold p-3 rounded-xl hover:bg-blue-700 transition">Place Order</button>
                    </form>
                    <div id="orderMessage" class="mt-4 text-sm font-semibold"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
    // Platform wise categories data
    const servicesData = {
        instagram: [
            { name: "Instagram Followers (HQ)", sampleServiceId: "101" },
            { name: "Instagram Likes & Views", sampleServiceId: "102" }
        ],
        facebook: [
            { name: "Facebook Page Likes & Followers", sampleServiceId: "201" },
            { name: "Facebook Video Views", sampleServiceId: "202" }
        ],
        youtube: [
            { name: "YouTube Monetization Watchtime [Max 4000H]", sampleServiceId: "301" },
            { name: "YouTube Views & Subscribers", sampleServiceId: "302" }
        ],
        telegram: [
            { name: "Telegram Channel Members", sampleServiceId: "401" },
            { name: "Telegram Post Views", sampleServiceId: "402" }
        ]
    };

    function filterPlatform(platform) {
        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.classList.remove('border-2', 'border-blue-600', 'text-blue-600');
            btn.classList.add('border', 'border-slate-200', 'text-slate-600');
        });
        const activeBtn = document.getElementById('btn-' + platform);
        activeBtn.classList.remove('border', 'border-slate-200', 'text-slate-600');
        activeBtn.classList.add('border-2', 'border-blue-600', 'text-blue-600');

        const categorySelect = document.getElementById('categorySelect');
        categorySelect.innerHTML = '';
        
        servicesData[platform].forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.sampleServiceId;
            opt.textContent = item.name;
            categorySelect.appendChild(opt);
        });

        document.getElementById('serviceId').value = servicesData[platform][0].sampleServiceId;
    }

    filterPlatform('instagram');

    document.getElementById('categorySelect').addEventListener('change', function(e) {
        document.getElementById('serviceId').value = e.target.value;
    });

    // Handle Order Submission
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const service = document.getElementById('serviceId').value;
        const link = document.getElementById('targetLink').value;
        const quantity = document.getElementById('quantity').value;
        const apiKey = "cb508e7eeff9002abb8c2c0ccd14c0a"; // Your JAP API Key[cite: 1]
        
        // সঠিক CORS প্রক্সি ফরম্যাট ব্যবহার করা হয়েছে
        const apiUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://justanotherpanel.com/api/v2');
        const messageDiv = document.getElementById('orderMessage');
        
        messageDiv.innerText = "Processing order...";
        messageDiv.className = "mt-4 text-sm font-semibold text-blue-600";
        
        const postData = new URLSearchParams();
        postData.append('key', apiKey);
        postData.append('action', 'add');
        postData.append('service', service);
        postData.append('link', link);
        postData.append('quantity', quantity);

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: postData
            });
            
            const result = await response.json();
            if(result.order) {
                messageDiv.innerText = "Order Successful! Order ID: " + result.order;
                messageDiv.className = "mt-4 text-sm font-semibold text-emerald-600";
            } else {
                messageDiv.innerText = "Error: " + (result.error || "Something went wrong");
                messageDiv.className = "mt-4 text-sm font-semibold text-red-600";
            }
        } catch (error) {
            messageDiv.innerText = "Network Error! Connection failed.";
            messageDiv.className = "mt-4 text-sm font-semibold text-amber-600";
            console.error('Error:', error);
        }
    });
    </script>
</body>
</html>

</body>
</html>
